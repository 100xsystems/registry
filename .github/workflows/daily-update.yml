name: Daily Registry Update (DISABLED)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        type: string
        default: 'Manual override'

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - name: Warn about deprecation
        run: |
          echo "⚠️  This workflow has been DISABLED in favor of 'Daily Feed Update'."
          echo "ℹ️  The 'Daily Feed Update' workflow now handles feeds, YC, and PH data 4x daily."
          echo "ℹ️  Use 'Daily Feed Update' → 'Run workflow' instead."
          echo ""
          echo "Reason: ${{ github.event.inputs.reason || 'Not specified' }}"
