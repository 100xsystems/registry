name: Dynamic Data Update

on:
  schedule:
    # Runs 4 times daily: morning (6:00 UTC), afternoon (12:00 UTC), evening (18:00 UTC), night (0:00 UTC)
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      historical:
        description: 'Run historical import (fetch up to 500 items per feed)'
        type: boolean
        default: false
      limit:
        description: 'Max items per feed'
        type: number
        default: 50
      feed:
        description: 'Single feed ID to update (empty = all feeds)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run feed update (parallel — all feeds at once)
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.historical }}" == "true" ]; then
            npm run update-feeds -- --historical --limit=${{ inputs.limit || 500 }}
          else
            npm run update-feeds -- --limit=${{ inputs.limit || 50 }}
          fi

      - name: Fetch YC Combinator changes via Algolia
        continue-on-error: true
        run: npm run fetch-yc

      - name: Fetch Product Hunt data via official API v2
        continue-on-error: true
        env:
          PH_API_KEY: ${{ secrets.PH_API_KEY }}
          PH_API_SECRET: ${{ secrets.PH_API_SECRET }}
        run: npm run fetch-ph

      - name: Check for changes
        id: git-check
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes — exiting"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d-%H%M')
          git config --local user.name "100xSystems Bot"
          git config --local user.email "bot@100xsystems.dev"
          git commit -m "chore(dynamic): data update — ${TIMESTAMP}"
          git push
