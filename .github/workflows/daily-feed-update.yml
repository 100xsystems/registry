name: Daily Feed Update

on:
  schedule:
    # Runs 4x daily at 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      historical:
        description: 'Run historical import (fetch up to 500 items per feed)'
        type: boolean
        default: false
      limit:
        description: 'Max items per feed'
        type: number
        default: 50
      feed:
        description: 'Single feed ID to update (empty = all feeds)'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # ⚡ 10 min is plenty — real run takes ~10s for 400+ feeds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Enough for the diff check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Latest LTS — fast native fetch, best undici perf
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run feed update (parallel — all feeds at once)
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.historical }}" == "true" ]; then
            npm run update-feeds -- --historical --limit=${{ inputs.limit || 500 }}
          else
            npm run update-feeds -- --limit=${{ inputs.limit || 50 }}
          fi

      - name: Fetch YC Combinator data (fast — raw.githubusercontent.com)
        continue-on-error: true
        run: npm run fetch-yc

      - name: Fetch Product Hunt data (fast — raw.githubusercontent.com)
        continue-on-error: true
        run: npm run fetch-ph

      - name: Check for changes
        id: git-check
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes — exiting"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.name "100xSystems Bot"
          git config --local user.email "bot@100xsystems.dev"
          git commit -m "chore(feeds): daily update — $(date +'%Y-%m-%d-%H%M')"
          git push
